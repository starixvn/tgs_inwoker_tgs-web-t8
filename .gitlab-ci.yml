include:
  - project: 'inwoker/tgs/tgs-gitlab-ci-jobs'
    ref: main
    file: '/templates/.lobby-deployment.yaml'

variables:
  ImageName: pgtgs/lobby-t8
  components_dev: lobby-t8
  components_staging: lobby-gpi-t8,lobby-gmo,lobby-mgm,lobby-sky,lobby-gpi-t9
  components_prod: lobby-gpi-t8,lobby-gmo,lobby-mgm,lobby-sky

build:
  stage: build
  extends: .build
  variables:
    GIT_CHECKOUT: "true" 
  only:
    - master
    - release/current
    - develop
  before_script:
    - printenv
    - echo "branch:$CI_COMMIT_BRANCH"
    - export DOCKER_BUILDKIT=0
    - export COMPOSE_DOCKER_CLI_BUILD=0
    - git config --file=.gitmodules submodule.src/components/Wap.branch $CI_COMMIT_BRANCH
    - git config --file=.gitmodules submodule.src/components/App/Account.branch $CI_COMMIT_BRANCH
    - git config --file=.gitmodules submodule.src/api-services.branch $CI_COMMIT_BRANCH
    - git submodule sync
    - git submodule update
  script:
    - export TAG="$(date -d $CI_PIPELINE_CREATED_AT +%Y%m%d).$CI_PIPELINE_IID"
    - docker build -t ${ImageName}:${TAG} -f ./Dockerfile .
    - docker push ${ImageName}:${TAG}
  artifacts:
    name: npm
    untracked: false
    expire_in: "7 days"
    
deploy-dev:
  extends: .deploy-dev

deploy-staging:
  extends: .deploy-staging
      
deploy-prod:
  extends: .deploy-prod