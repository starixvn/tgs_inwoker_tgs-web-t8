include:
  - project: 'inwoker/tgs/tgs-gitlab-ci-jobs'
    ref: main
    file: '/templates/.lobby-deployment.yaml'

variables:
  ImageName: pgtgs/lobby-t8
  
build:
  extends: .build
  tags:
    - local-build
  only:
    - master
    - release/current
    - develop

deploy-dev:
  extends: .deploy-base
  variables:
    namespace: "dev"
    components: "dev_t8"
  tags:
    - dev
    - deploy
  only:
    - develop

deploy-staging:
  extends: .deploy-base
  variables:
    namespace: "staging"
    components: "staging_t8"
  tags:
    - staging
    - deploy
  only:
    - release/current
  when: manual

deploy-prod:
  extends: .deploy-base
  variables:
    namespace: "prod"
    components: "prod_t8"
  tags:
    - prod
    - deploy
  only:
    - master
  when: manual